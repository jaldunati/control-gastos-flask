<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Control de Gastos{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='estilos.css') }}"></head><body><header><div class="wrap head"><a class="brand" href="{{ url_for('inicio') if session.get('usuario_id') else url_for('login') }}">Control de Gastos</a>{% if session.get('usuario_id') %}<nav><a href="{{ url_for('inicio') }}">Inicio</a><a href="{{ url_for('gastos') }}">Mis gastos</a><a href="{{ url_for('nuevo') }}">Registrar gasto</a><a href="{{ url_for('reporte') }}">Reportes</a><a href="{{ url_for('logout') }}">Salir</a></nav>{% endif %}</div></header><main class="wrap main">{% with ms=get_flashed_messages(with_categories=true) %}{% for c,m in ms %}<div class="alert {{ c }}">{{ m }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><footer>Aplicación académica · Python + Flask + SQLite</footer></body></html>
