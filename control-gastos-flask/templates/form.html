{% extends "base.html" %}{% block title %}Formulario de gasto{% endblock %}{% block content %}<small class="eyebrow">REGISTRO</small><h1>{{ 'Editar gasto' if gasto else 'Registrar gasto' }}</h1><section class="panel formpanel"><form method="POST"><label>Fecha<input type="date" name="fecha" value="{{ gasto.fecha if gasto else hoy }}" required></label><label>Descripción<input name="descripcion" maxlength="150" value="{{ gasto.descripcion if gasto else '' }}" placeholder="Ej. Compra de alimentos" required></label><label>Monto (S/)<input type="number" name="monto" min="0.01" step="0.01" value="{{ gasto.monto if gasto else '' }}" placeholder="0.00" required></label><div class="actions"><a class="btn secondary" href="{{ url_for('gastos') }}">Cancelar</a><button class="btn">Guardar gasto</button></div></form></section>{% endblock %}
